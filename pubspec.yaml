name: scan_gr
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  mobile_scanner: ^7.2.0
  http: ^1.6.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/maj-gold.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/maj-gold.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
